<!DOCTYPE html>

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a1628; /* dark blue */
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
  }
  /* .field is sized/positioned by the script below to exactly overlay the
     cover-fit background image, so players positioned in % of .field stay
     glued to image content when the window is resized. */
  .field {
    position: absolute;
    background: url("./assets/screenshots-riverwood-to-whiterun/20261119181917_1.jpg") center / 100% 100% no-repeat;
  }
  /* one .player div per NPC: tune left / bottom / height / z-index here.
     left = horizontal center of the figure, bottom = bottom edge of the image,
     both in % of the background image; height = figure height in % of image height. */
  .player {
    position: absolute;
    transform: translateX(-50%);
  }
  .player img {
    height: 100%;
    display: block;
    filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.45));
  }
  /* Skyrim-style floating name label (Futura Condensed is the Skyrim UI font) */
  .npc-name {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 0.8vh;
    white-space: nowrap;
    font-family: "Futura Condensed", Futura, "Century Gothic", "Arial Narrow", sans-serif;
    font-stretch: condensed;
    font-size: 2.2vh;
    letter-spacing: 0.05em;
    color: #fff;
    text-shadow: 0 0 4px rgba(0,0,0,0.9), 1px 1px 2px #000, -1px -1px 2px #000;
  }
  .attribution {
    position: absolute;
    right: 1vw;
    bottom: 1vh;
    z-index: 10;
    font-family: Futura, "Century Gothic", sans-serif;
    font-size: 1.5vh;
    color: rgba(255, 255, 255, 0.55);
    text-shadow: 1px 1px 2px #000;
  }
  .attribution a { color: rgba(255, 255, 255, 0.75); }
  /* presentation layer cycle (body[data-layer]):
     0 = everything (initial), 1 = base screenshot only, 2 = + offensive line, then back to 0 */
  body[data-layer="1"] .player,
  body[data-layer="1"] .attribution { visibility: hidden; }
  body[data-layer="2"] .player.offense { visibility: hidden; }
</style>

<script>
  // natural pixel size of the background screenshot
  const BG_W = 1920, BG_H = 1080;
  // replicate object-fit: cover for the .field container
  function layoutField() {
    const s = Math.max(window.innerWidth / BG_W, window.innerHeight / BG_H);
    const w = BG_W * s, h = BG_H * s;
    const f = document.getElementById('field');
    f.style.width = w + 'px';
    f.style.height = h + 'px';
    f.style.left = (window.innerWidth - w) / 2 + 'px';
    f.style.top = (window.innerHeight - h) / 2 + 'px';
  }
  window.addEventListener('resize', layoutField);
  layoutField();

  // presentation layer cycle: 0 = everything (initial load), 1 = base screenshot
  // only, 2 = + offensive line, then back to 0. Advance with click or any key.
  let layerState = 0;
  document.body.dataset.layer = layerState;
  function advanceLayer() {
    layerState = (layerState + 1) % 3;
    document.body.dataset.layer = layerState;
  }
  window.addEventListener('mousedown', advanceLayer);
  window.addEventListener('keydown', advanceLayer);
</script>
