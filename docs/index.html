<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a1628; /* dark blue */
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
  }
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }
  /* one .player div per NPC: tune left / bottom / height / z-index here */
  .player {
    position: absolute;
    transform: translateX(-50%);
  }
  .player img {
    height: 100%;
    display: block;
    filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.45));
  }
  /* Skyrim-style floating name label (Futura Condensed is the Skyrim UI font) */
  .npc-name {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 0.8vh;
    white-space: nowrap;
    font-family: "Futura Condensed", Futura, "Century Gothic", "Arial Narrow", sans-serif;
    font-stretch: condensed;
    font-size: 2.6vh;
    letter-spacing: 0.05em;
    color: #fff;
    text-shadow: 0 0 4px rgba(0,0,0,0.9), 1px 1px 2px #000, -1px -1px 2px #000;
  }
  .attribution {
    position: absolute;
    right: 1vw;
    bottom: 1vh;
    z-index: 10;
    font-family: Futura, "Century Gothic", sans-serif;
    font-size: 1.5vh;
    color: rgba(255, 255, 255, 0.55);
    text-shadow: 1px 1px 2px #000;
  }
  .attribution a { color: rgba(255, 255, 255, 0.75); }
</style>
</head>
